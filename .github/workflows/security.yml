name: Security Scan (Secrets & Audit)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'auditoria_integridad_datos/**'
  pull_request:
    paths-ignore:
      - 'auditoria_integridad_datos/**'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan (Secrets & Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks secrets scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --exit-code 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: transparencia-app
