name: Security Scan (Secrets & Audit)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'auditoria_integridad_datos/**'
  pull_request:
    paths-ignore:
      - 'auditoria_integridad_datos/**'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan (Secrets & Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks secrets scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --exit-code 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Audit production dependencies
        run: |
          set +e
          audit_output=$(npm audit --omit=dev --audit-level=high \
            --fetch-retries=1 \
            --fetch-retry-mintimeout=1000 \
            --fetch-retry-maxtimeout=5000 \
            --fetch-timeout=30000 2>&1)
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"
          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s\n' "$audit_output" | grep -Eqi 'npm warn audit (429|5[0-9][0-9])|audit endpoint returned an error|ENOAUDIT|ECONNRESET|ETIMEDOUT'; then
            echo "::warning title=Registro npm no disponible::La auditoría no pudo consultar el servicio externo; CodeQL y Gitleaks permanecen obligatorios."
            exit 0
          fi
          exit "$audit_status"
        working-directory: transparencia-app
