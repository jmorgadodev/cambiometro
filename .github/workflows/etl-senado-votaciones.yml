name: ETL Diario - Votaciones Senado

on:
  schedule:
    - cron: "30 7 * * *" # 30 minutos después de Cámara, 03:30 CLT en invierno
  workflow_dispatch:
    inputs:
      from:
        description: Fecha inicial YYYY-MM-DD (por defecto 3 días atrás)
        required: false
      to:
        description: Fecha final YYYY-MM-DD
        required: false
      full_votaciones:
        description: Reconstruir todo el histórico del Senado (sólo backfill)
        required: false
        type: boolean
        default: false
      repair_staged:
        description: Ejecutar reparación aislada de particiones R2 (no ETL general)
        required: false
        type: boolean
        default: false
      confirm_repair:
        description: Escribe CAMBIOMETRO_CONFIRM_SENADO_VOTACIONES_REPAIR para reparar
        required: false
        default: ""

concurrency:
  group: cambiometro-static-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-publish:
    if: github.event_name != 'workflow_dispatch' || inputs.repair_staged != true
    name: Votaciones oficiales del Senado
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales de datos
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DATA_API_TOKEN"

      - name: Recuperar catálogo vigente
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          mkdir -p data/lake/catalog/v1
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Resolver rango con solapamiento
        id: range
        shell: bash
        env:
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          echo "from=${INPUT_FROM:-$(date -u -d '3 days ago' +%F)}" >> "$GITHUB_OUTPUT"
          echo "to=${INPUT_TO:-$(date -u +%F)}" >> "$GITHUB_OUTPUT"

      - name: Preparar workspace ETL sin datasets versionados
        working-directory: transparencia-app
        run: npm run etl:prepare

      - name: Hidratar snapshot combinado vigente antes de actualizar Senado
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:hydrate:static -- --required --required-files data/politicos-votaciones.json --only-files data/politicos-votaciones.json --force

      - name: Ingerir sólo votaciones del Senado
        id: ingest
        working-directory: transparencia-app
        run: |
          npm run etl -- --from "${{ steps.range.outputs.from }}" --to "${{ steps.range.outputs.to }}" --source votaciones_senado
          node --input-type=module -e "import {readFileSync,appendFileSync} from 'node:fs'; import {senateVotePublicationReady} from './scripts/etl/senate-vote-publication.mjs'; const ready=senateVotePublicationReady(JSON.parse(readFileSync('data/etl/status.json','utf8'))); appendFileSync(process.env.GITHUB_OUTPUT, 'publish='+ready+'\n'); console.log(ready?'Novedades verificadas para publicar':'Sin novedades: no se modifica el release vigente');"

      - name: Construir y publicar lake de Senado
        if: steps.ingest.outputs.publish == 'true'
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npm run data:lake -- --source votaciones_senado --hydrate-history
          npm run data:publish

      - name: Actualizar cache estático incremental del Senado
        if: steps.ingest.outputs.publish == 'true'
        working-directory: transparencia-app
        env:
          FULL_VOTACIONES: ${{ inputs.full_votaciones }}
        shell: bash
        run: |
          if [[ "$FULL_VOTACIONES" == "true" ]]; then
            npm run ingest:votaciones-full -- --source senado --full
          else
            npm run ingest:votaciones-full -- --source senado
          fi

      - name: Reconciliar proyección estática Senado 2026+ desde R2
        if: steps.ingest.outputs.publish == 'true'
        working-directory: transparencia-app
        run: node scripts/sync-senado-votes-static.mjs --from 2026-01 --to "$(date -u +%Y-%m)"

      - name: Construir subsets estáticos
        if: steps.ingest.outputs.publish == 'true'
        working-directory: transparencia-app
        run: npm run data:build:subsets

      - name: Publicar entradas estáticas de Parlamento
        if: steps.ingest.outputs.publish == 'true'
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:static -- --groups parlamento

  repair-staged:
    if: github.event_name == 'workflow_dispatch' && inputs.repair_staged == true
    uses: ./.github/workflows/repair-senado-votaciones-staged.yml
    with:
      from: ${{ inputs.from || '' }}
      to: ${{ inputs.to || '' }}
      confirm_repair: ${{ inputs.confirm_repair }}
    secrets: inherit
