name: Uptime Smoke Cron (5 min)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Production Uptime Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Uptime Smoke Check
        working-directory: transparencia-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Los hosts se pueden cambiar mediante variables de repositorio sin
          # editar el workflow. El fallback es el dominio productivo real;
          # no usar un preview como si fuera producción.
          PROD_URL: ${{ vars.CAMBIOMETRO_PROD_URL || 'https://cambiometro.impulsacv.cl' }}
          API_URL: ${{ vars.CAMBIOMETRO_API_URL || 'https://cambiometro.impulsacv.cl' }}
          UPTIME_TOKEN: ${{ secrets.CAMBIOMETRO_UPTIME_TOKEN }}
        run: node scripts/uptime-smoke.mjs
