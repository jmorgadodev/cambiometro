name: Uptime Smoke Cron (5 min)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Production Uptime Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Uptime Smoke Check
        working-directory: transparencia-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_URL: "https://cambiometro.impulsacv.cl"
        run: node scripts/uptime-smoke.mjs
