name: Uptime smoke

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Pages and API routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://cambiometro.impulsacv.cl"
          for path in / /politico /municipalidades /servicios-publicos /entidades /transferencias /api/v1/health/data; do
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 20 "$base$path")
            test "$status" -ge 200 -a "$status" -lt 500
            echo "$path $status"
          done
