name: ETL Mensual - InfoProbidad DIP

on:
  schedule:
    - cron: "0 9 10 * *" # Día 10 de cada mes, 05:00 CLT
  workflow_dispatch:
    inputs:
      verify_release_only:
        description: Verificar checksum del release vigente sin extracción ni publicación
        type: boolean
        default: false
      from:
        description: Fecha inicio YYYY-MM-DD (por defecto 30 días atrás)
        required: false
      to:
        description: Fecha fin YYYY-MM-DD
        required: false

concurrency:
  group: cambiometro-static-publication
  cancel-in-progress: false
  queue: max

jobs:
  ingest-publish:
    name: Declaraciones Juradas de Intereses y Patrimonio (Ley 20.880)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales y recuperar catálogo vigente
        shell: bash
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          mkdir -p data/lake/catalog/v1
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Preparar workspace ETL sin datasets versionados
        if: inputs.verify_release_only != true
        working-directory: transparencia-app
        run: npm run etl:prepare

      - name: Ingerir y proyectar InfoProbidad DIP
        if: inputs.verify_release_only != true
        working-directory: transparencia-app
        env:
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          from_date="${INPUT_FROM:-$(date -u -d '30 days ago' +%F)}"
          to_date="${INPUT_TO:-$(date -u +%F)}"
          npm run ingest:infoprobidad -- --from "$from_date" --to "$to_date" --concurrency 2
          npm run data:lake:projection:infoprobidad
          npm run data:build:subsets
          npm run data:publish

      - name: Publicar entradas estáticas versionadas para Pages
        if: inputs.verify_release_only != true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:static -- --groups infoprobidad

      - name: Verificar release InfoProbidad publicado sin extracción ni escrituras
        if: inputs.verify_release_only == true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:hydrate:static -- --required --required-files data/lake/projections/v1/infoprobidad.json,data/lake-subsets/infoprobidad.subset.json --only-files data/lake/projections/v1/infoprobidad.json,data/lake-subsets/infoprobidad.subset.json --force

      # D1 no participa en este ETL; R2 conserva el release público canónico.
