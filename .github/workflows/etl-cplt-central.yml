name: ETL manual - CPLT nóminas centrales

# La nómina central se mantiene separada de la municipal. Este flujo queda
# manual hasta medir tamaño, duración y consumo de R2 con un release completo.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar el release central validado en R2 después de revisar el resumen"
        required: false
        default: false
        type: boolean
      confirm_storage:
        description: "Confirmar que la auditoría vigente de almacenamiento R2 permite publicar"
        required: false
        default: false
        type: boolean
      gzip_json:
        description: "Publicar JSON de la proyección central comprimido con gzip"
        required: false
        default: false
        type: boolean
      gzip_in_place:
        description: "Reemplazar en sitio los objetos activos, conservando sus claves y evitando almacenamiento temporal duplicado"
        required: false
        default: false
        type: boolean

concurrency:
  group: cambiometro-cplt-central-publication
  cancel-in-progress: true

jobs:
  cplt-central-categories:
    name: Ingesta central CPLT (${{ matrix.category }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Cada categoría descarga y materializa archivos grandes. Ejecutarlas
      # secuencialmente evita multiplicar el uso de disco y ancho de banda.
      max-parallel: 1
      matrix:
        category: [Planta, Contrata, Honorarios, CodigoTrabajo]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app
      - name: Verificar espacio antes de descargar la categoría
        working-directory: transparencia-app
        env:
          CAMBIOMETRO_MIN_FREE_GB: "8"
        run: node scripts/check-workspace-capacity.mjs --path ..
      - name: Procesar sólo organismos centrales
        working-directory: transparencia-app
        run: npm run ingest:cplt-personal -- "${{ matrix.category }}" --scope=central
      - name: Preparar artefacto validado
        working-directory: transparencia-app
        run: npm run data:publish:cplt-central-category -- "${{ matrix.category }}" --scope=central
      - uses: actions/upload-artifact@v4
        with:
          name: cplt-central-${{ matrix.category }}
          path: transparencia-app/data/cplt-central-category/${{ matrix.category }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

  cplt-central-finalize:
    name: Publicar proyección central en R2
    needs: cplt-central-categories
    if: needs.cplt-central-categories.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      # La proyección central supera los dos millones de filas. La etapa de
      # índices necesita más heap que el límite predeterminado de Node.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app
      - uses: actions/download-artifact@v4
        with:
          pattern: cplt-central-*
          path: transparencia-app/data/cplt-central-artifacts
      - name: Bloquear publicación sin confirmación de almacenamiento
        if: inputs.publish == true && inputs.confirm_storage != true
        run: |
          echo "R2_STORAGE_CONFIRMATION_REQUIRED: activa publish y confirm_storage sólo después de revisar el margen R2."
          exit 1
      - name: Bloquear compresión en sitio sin lector compatible
        if: inputs.publish == true && inputs.gzip_in_place == true && inputs.gzip_json != true
        run: |
          echo "R2_GZIP_READER_CONFIRMATION_REQUIRED: gzip_in_place requiere gzip_json=true y el Worker compatible ya promovido."
          exit 1
      - name: Consolidar la proyección central sin publicar
        if: inputs.publish != true
        working-directory: transparencia-app
        run: npm run data:finalize:cplt-central:local
      - name: Resolver versión activa R2 para compactación en sitio
        id: active-central-release
        if: inputs.publish == true && inputs.gzip_in_place == true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          manifest="$RUNNER_TEMP/funcionarios-central-manifest.json"
          npx wrangler r2 object get transparencia-public-data/projections/funcionarios-central-v1/manifest.json --file "$manifest" --remote
          version=$(node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")).version; if (!/^[a-zA-Z0-9._-]+$/.test(value ?? "")) process.exit(1); process.stdout.write(value);' "$manifest")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publicar sólo después de confirmación explícita
        if: inputs.publish == true && inputs.confirm_storage == true && inputs.gzip_json != true && inputs.gzip_in_place != true
        working-directory: transparencia-app
        run: npm run data:finalize:cplt-central:r2
      - name: Publicar proyección central comprimida
        if: inputs.publish == true && inputs.confirm_storage == true && inputs.gzip_json == true && inputs.gzip_in_place != true
        working-directory: transparencia-app
        run: npm run data:finalize:cplt-central:r2:gzip
      - name: Comprimir proyección central activa en sitio
        if: inputs.publish == true && inputs.confirm_storage == true && inputs.gzip_json == true && inputs.gzip_in_place == true
        working-directory: transparencia-app
        env:
          CAMBIOMETRO_STORAGE_VERSION: ${{ steps.active-central-release.outputs.version }}
        run: npm run data:finalize:cplt-central:r2:gzip-in-place
