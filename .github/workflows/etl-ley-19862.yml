name: ETL Mensual - Ley 19.862 Transferencias del Estado

on:
  schedule:
    - cron: "0 9 8 * *" # Día 8 de cada mes, 05:00 CLT
  workflow_dispatch:
    inputs:
      full_backfill:
        description: Reprocesar todas las particiones 2026 desde el origen oficial
        required: false
        type: boolean
        default: false
      year:
        description: Año a procesar (ej. 2026)
        required: false
      month:
        description: Mes a procesar (1-12)
        required: false

concurrency:
  group: etl-ley-19862
  cancel-in-progress: true

jobs:
  ingest-publish-materialize:
    name: Transferencias a Fundaciones y ONGs (Ley 19.862)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales y recuperar catálogo vigente
        shell: bash
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          mkdir -p data/lake/catalog/v1
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Preparar workspace ETL sin datasets versionados
        working-directory: transparencia-app
        run: npm run etl:prepare -- --download-projections --sources ley-19862

      - name: Hidratar particiones históricas de transferencias desde R2
        if: ${{ inputs.full_backfill != true }}
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:hydrate:ley19862

      - name: Ingerir y proyectar Transferencias Ley 19.862
        working-directory: transparencia-app
        env:
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_MONTH: ${{ inputs.month }}
          FULL_BACKFILL: ${{ inputs.full_backfill }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          if [[ "$FULL_BACKFILL" == "true" ]]; then
            target_year="${INPUT_YEAR:-$(date -u +%Y)}"
            for target_month in $(seq 1 8); do
              npm run ingest:ley-19862 -- --year "$target_year" --month "$target_month"
              npm run data:lake:projection:ley19862
              npm run data:build:subsets
              npm run data:lake
              npm run data:publish
            done
          else
            period=$(date -u -d '1 month ago' +%Y-%m)
            target_year="${INPUT_YEAR:-${period%-*}}"
            target_month="${INPUT_MONTH:-$((10#${period#*-}))}"
            npm run ingest:ley-19862 -- --year "$target_year" --month "$target_month"
            npm run data:lake:projection:ley19862
            npm run data:build:subsets
            npm run data:lake
            npm run data:publish
          fi

      - name: Publicar entradas estáticas versionadas para Pages
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:static -- --groups ley19862

      - name: Publicar release completo para Pages y Worker
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:transfer-api

      - name: Refrescar catálogo maestro antes de materializar
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Materializar D1 y registrar ejecución
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          ETL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run data:materialize -- --database transparencia-db --remote --sources ley-19862
