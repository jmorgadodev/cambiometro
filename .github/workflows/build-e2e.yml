name: Build and E2E Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'auditoria_integridad_datos/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'auditoria_integridad_datos/**'
  workflow_dispatch:

concurrency:
  group: build-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    name: OpenNext Cloudflare Build & Playwright Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            transparencia-app/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('transparencia-app/package-lock.json') }}-${{ hashFiles('transparencia-app/app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('transparencia-app/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: transparencia-app

      - name: Build Cloudflare Worker artifact
        run: npm run cf:build
        working-directory: transparencia-app

      - name: Install browser for integration checks
        run: npx playwright install --with-deps chromium
        working-directory: transparencia-app

      - name: Prepare isolated local D1 fixture
        working-directory: transparencia-app
        run: |
          npx wrangler d1 migrations apply transparencia-db --local
          npx wrangler d1 execute transparencia-db --local --file fixtures/d1-browser.sql

      - name: Verify routes, APIs, responsive UI and widget
        working-directory: transparencia-app
        env:
          VERIFY_BASE_URL: http://127.0.0.1:3003
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: |
          npx wrangler dev --local --port 3003 --log-level warn > /tmp/cambiometro-worker.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=""
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3003/ > /dev/null; then
              ready="yes"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            cat /tmp/cambiometro-worker.log
            exit 1
          fi
          npm run verify:browser
          npm run verify:security
