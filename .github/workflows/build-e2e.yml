name: Build and E2E Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - 'auditoria_integridad_datos/**'
  pull_request:
    paths-ignore:
      - 'auditoria_integridad_datos/**'
  workflow_dispatch:

concurrency:
  group: build-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    name: Static Pages & API Worker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            transparencia-app/.next/cache
          # Next puede prerenderar datos leídos desde lib/data durante el build.
          # La clave debe invalidarse también para esos inputs; de lo contrario
          # un cache antiguo puede servir HTML sin los detalles recién agregados.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('transparencia-app/package-lock.json', 'transparencia-app/app/**', 'transparencia-app/components/**', 'transparencia-app/lib/**', 'transparencia-app/data/**', 'transparencia-app/scripts/**', 'transparencia-app/public/**', 'transparencia-app/next.config.ts') }}

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Build static Pages artifact and guards
        env:
          # E2E usa la proyección fixture porque los secretos R2 no están
          # disponibles en PRs. Pages producción nunca define esta variable.
          ALLOW_STATIC_SAMPLE: "1"
          NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run pages:build && npm run pages:verify && npm run api:size
        working-directory: transparencia-app

      - name: Verify Worker Runtime Bundle Budget
        run: node scripts/audit/measure-bundle-size.mjs
        working-directory: transparencia-app

      - name: Install browser for integration checks
        run: npx playwright install --with-deps chromium
        working-directory: transparencia-app

      - name: Prepare isolated local D1 fixture
        working-directory: transparencia-app
        run: |
          for migration in migrations/*.sql; do
            npx wrangler d1 execute transparencia-db --local --config workers/public-api/wrangler.jsonc --file "$migration"
          done
          npx wrangler d1 execute transparencia-db --local --config workers/public-api/wrangler.jsonc --file fixtures/d1-browser.sql

      - name: Verify routes, APIs, responsive UI and widget
        working-directory: transparencia-app
        env:
          VERIFY_BASE_URL: http://127.0.0.1:3003
          VERIFY_API_URL: http://127.0.0.1:8788
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: |
          npx wrangler dev --local --config workers/public-api/wrangler.jsonc --port 8788 --inspector-port 9230 --log-level warn > /tmp/cambiometro-api.log 2>&1 &
          api_pid=$!
          npx wrangler pages dev out --port 3003 --proxy 8788 --inspector-port 9231 --compatibility-date=2026-08-08 --log-level warn > /tmp/cambiometro-pages.log 2>&1 &
          pages_pid=$!
          trap 'kill "$api_pid" "$pages_pid" 2>/dev/null || true' EXIT
          ready=""
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3003/ > /dev/null; then
              ready="yes"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            cat /tmp/cambiometro-api.log
            cat /tmp/cambiometro-pages.log
            exit 1
          fi
          npm run verify:browser
          npm run verify:themes
          npm run verify:security

      - name: Upload theme evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-screenshots-${{ github.sha }}
          path: transparencia-app/artifacts/themes
          if-no-files-found: warn
          retention-days: 14
