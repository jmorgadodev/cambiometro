name: ETL Diario - Movimientos de Autoridades

on:
  schedule:
    - cron: "0 7 * * *" # 03:00 America/Santiago en horario de invierno
  workflow_dispatch:

concurrency:
  group: cambiometro-static-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest-publish:
    name: Detectar, validar y publicar movimientos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Instalar dependencias
        working-directory: transparencia-app
        run: npm ci

      - name: Exigir credenciales R2
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DATA_API_TOKEN"

      - name: Recuperar último snapshot válido desde R2
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-movimientos
          npx wrangler r2 object get transparencia-public-data/projections/static-site-v1/manifest.json --file .ci-movimientos/static-site-manifest.json --remote
          node scripts/hydrate-static-site-inputs.mjs --required --manifest-file .ci-movimientos/static-site-manifest.json --required-files data/movimientos.json --only-files data/movimientos.json --force
          cp data/movimientos.json data/movimientos.previous.json

      - name: Revisar y validar novedades de Movimientos
        id: movimientos_etl
        working-directory: transparencia-app
        env:
          # Las señales se publican sólo en estado en_confirmacion; nunca se
          # convierten automáticamente en salidas oficiales sin acto legal.
          MOVIMIENTOS_RELEASE_APPROVED: "1"
          MOVIMIENTOS_RUN_REPORT: data/generated/movimientos-run.json
          MOVIMIENTOS_INPUT: data/movimientos.previous.json
          # Reincorpora candidatos periodísticos revisados que aún no estén
          # en el release R2 anterior; sólo se leen sus señales, nunca sus filas.
          MOVIMIENTOS_SIGNAL_SEED: data/movimientos.json
          MOVIMIENTOS_PROVISIONAL_SOURCES: ${{ vars.MOVIMIENTOS_PROVISIONAL_SOURCES }}
          # El servidor de Prensa Presidencia omite su intermedio Sectigo.
          # Se agrega sólo ese intermedio público y se conserva la validación
          # TLS normal; nunca se usa NODE_TLS_REJECT_UNAUTHORIZED=0.
          NODE_OPTIONS: "--use-system-ca"
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/transparencia-app/config/certs/sectigo-public-server-authentication-ca-ov-r36.pem
        run: |
          npm run etl:movimientos
          PUBLISH=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const report=JSON.parse(readFileSync("data/generated/movimientos-run.json","utf8")); process.stdout.write(report.published === true ? "true" : "false");')
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Validar snapshot y publicar grupo estático
        if: steps.movimientos_etl.outputs.publish == 'true'
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          node --input-type=module -e 'import { readFileSync, writeFileSync } from "node:fs"; import { normalizeMovementPayload, validateMovementPayload } from "./scripts/movimientos-pipeline.mjs"; const file="data/movimientos.json"; const payload=normalizeMovementPayload(JSON.parse(readFileSync(file,"utf8"))); validateMovementPayload(payload); writeFileSync(file, `${JSON.stringify(payload,null,2)}\n`);'
          npm run data:publish:static -- --groups movimientos

      - name: Publicar resumen de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movimientos-run-${{ github.run_id }}
          path: transparencia-app/data/generated/movimientos-run.json
          if-no-files-found: warn
          retention-days: 30
