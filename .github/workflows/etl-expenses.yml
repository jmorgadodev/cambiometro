name: ETL Mensual - Gastos Operacionales Senado

on:
  schedule:
    - cron: "30 8 2,12,22 * *" # reintentos para publicaciones oficiales tardías
  workflow_dispatch:
    inputs:
      camara_candidate_sha256:
        description: SHA-256 del candidato Cámara inmutable preparado en R2
        required: false
        type: string
        default: ""
      camara_source_sha:
        description: SHA main integrado usado por el ejecutor local de Cámara
        required: false
        type: string
        default: ""
      camara_recovery_sha256:
        description: SHA-256 de la captura oficial de Cámara, julio y agosto de 2026, preparada en R2
        required: false
        type: string
        default: ""
      full_history:
        description: Reconstruir todos los meses publicados (sólo backfill o bootstrap)
        required: false
        type: boolean
        default: false

concurrency:
  group: cambiometro-static-publication
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  recover-camara:
    if: github.event_name == 'workflow_dispatch' && inputs.camara_recovery_sha256 != '' && inputs.camara_candidate_sha256 == ''
    name: Recuperar julio y agosto de Cámara desde evidencia verificada
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json
      - run: npm ci
        working-directory: transparencia-app
      - name: Conciliar los montos y promover el manifiesto R2
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          CAMARA_RECOVERY_SHA256: ${{ inputs.camara_recovery_sha256 }}
        run: node scripts/recover-camara-expenses.mjs "$CAMARA_RECOVERY_SHA256"

  publish-camara-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.camara_candidate_sha256 != '' && inputs.camara_recovery_sha256 == ''
    name: Promover candidato verificado de Cámara sin ejecutar otras fuentes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validar procedencia del código de extracción
        env:
          CAMARA_SOURCE_SHA: ${{ inputs.camara_source_sha }}
          CAMARA_CANDIDATE_SHA256: ${{ inputs.camara_candidate_sha256 }}
        run: |
          [[ "$CAMARA_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CAMARA_CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          git merge-base --is-ancestor "$CAMARA_SOURCE_SHA" origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json
      - run: npm ci
        working-directory: transparencia-app
      - name: Validar candidato, preservar el resto del release y promover con CAS
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          CAMARA_SOURCE_SHA: ${{ inputs.camara_source_sha }}
          CAMARA_CANDIDATE_SHA256: ${{ inputs.camara_candidate_sha256 }}
        run: node scripts/promote-camara-expense-candidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gastos-camara-promotion-${{ github.run_id }}
          path: transparencia-app/.ci-data-version/gastos-camara
          if-no-files-found: warn
          retention-days: 30

  ingest-publish-r2:
    if: github.event_name != 'workflow_dispatch' || (inputs.camara_recovery_sha256 == '' && inputs.camara_candidate_sha256 == '')
    name: Gastos operacionales del Senado; Cámara se ejecuta localmente
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales de datos
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DATA_API_TOKEN"

      - name: Recuperar catálogo vigente
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          mkdir -p data/lake/catalog/v1
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Recuperar los subconjuntos vigentes antes de actualizar Senado
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: node scripts/etl-expenses-local.mjs --hydrate-only --force

      - name: Preparar workspace ETL
        working-directory: transparencia-app
        run: npm run etl:prepare

      - name: Ingerir gastos oficiales de Senado de forma incremental
        working-directory: transparencia-app
        shell: bash
        run: |
          full_history=""
          if [[ "${{ inputs.full_history }}" == "true" ]]; then full_history="--full-history"; fi
          npm run etl -- --from "$(date -u -d '60 days ago' +%F)" --to "$(date -u +%F)" --source gastos_senado --require-published-expense-baseline $full_history

      - name: Construir y publicar lake
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npm run data:lake -- --source gastos_senado --hydrate-history
          npm run data:publish

      - name: Generar subsets estáticos completos
        working-directory: transparencia-app
        run: npm run data:build:subsets

      - name: Verificar release de gastos antes de publicarlo
        working-directory: transparencia-app
        run: node scripts/verify-expense-release.mjs --required

      - name: Publicar gastos como entradas autorizadas de Pages
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:static -- --groups gastos
