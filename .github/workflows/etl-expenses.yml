name: ETL Mensual - Gastos Operacionales Congreso

on:
  schedule:
    - cron: "30 8 2 * *" # segundo día del mes, después de la publicación oficial
  workflow_dispatch:
    inputs:
      full_history:
        description: Reconstruir todos los meses publicados (sólo backfill o bootstrap)
        required: false
        type: boolean
        default: false

concurrency:
  group: etl-expenses
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ingest-publish-materialize:
    name: Senado — conserva el release de Cámara publicado localmente
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales de datos
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DATA_API_TOKEN"

      - name: Recuperar catálogo vigente
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          mkdir -p data/lake/catalog/v1
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Recuperar los subconjuntos vigentes antes de actualizar Senado
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: node scripts/etl-expenses-local.mjs --hydrate-only --force

      - name: Preparar workspace ETL
        working-directory: transparencia-app
        run: npm run etl:prepare

      - name: Ingerir gastos oficiales de Senado de forma incremental
        working-directory: transparencia-app
        shell: bash
        run: |
          full_history=""
          if [[ "${{ inputs.full_history }}" == "true" ]]; then full_history="--full-history"; fi
          npm run etl -- --from "$(date -u -d '60 days ago' +%F)" --to "$(date -u +%F)" --source gastos_senado $full_history

      - name: Construir y publicar lake
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npm run data:lake -- --exclude-source infolobby,infoprobidad
          npm run data:publish

      - name: Materializar gastos en D1 productiva
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          ETL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-expenses
        shell: bash
        run: |
          set +e
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          npm run data:materialize -- --database transparencia-db --remote --skip-unchanged --sources gastos_senado >"$log_file" 2>&1
          status=$?
          cat "$log_file"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Fq "code: 7500" "$log_file"; then
            echo "::warning::D1 alcanzó el límite diario gratuito de rows_read; R2 y Pages seguirán siendo la fuente canónica de gastos."
            echo "D1 materialization deferred because the free rows_read quota was exhausted; R2/static publication continues." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      - name: Generar subsets estáticos completos
        working-directory: transparencia-app
        run: npm run data:build:subsets

      - name: Verificar release de gastos antes de publicarlo
        working-directory: transparencia-app
        run: node scripts/verify-expense-release.mjs --required

      - name: Publicar gastos como entradas autorizadas de Pages
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:static -- --groups gastos
