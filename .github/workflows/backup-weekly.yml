name: Backup Semanal (R2; D1 manual)

on:
  schedule:
    - cron: "0 5 * * 0" # 01:00 CLT, domingo
  workflow_dispatch:
    inputs:
      backup_d1:
        description: "Exportar D1 excepcionalmente (consume rows_read; sólo si fue revisado)"
        type: boolean
        required: false
        default: false
      confirm_d1_backup:
        description: "Escribe CAMBIOMETRO_D1_BACKUP para autorizar el dump D1"
        type: string
        required: false
        default: ""

concurrency:
  group: backup-weekly
  cancel-in-progress: true

jobs:
  backup:
    name: Copiar data lake a R2 backups (D1 sólo manual)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Ejecutar backup semanal
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          BACKUP_D1: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_d1 == true && inputs.confirm_d1_backup == 'CAMBIOMETRO_D1_BACKUP' && '1' || '0' }}
          D1_BACKUP_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_d1_backup || '' }}
        run: node scripts/backup-weekly.mjs

  drill-restore:
    name: Drill Restore (Post-Backup)
    runs-on: ubuntu-latest
    needs: backup
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Ejecutar drill de restore (entorno aislado)
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: node scripts/restore-drill.mjs
