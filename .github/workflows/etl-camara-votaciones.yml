name: ETL Diario - Votaciones Cámara

on:
  schedule:
    - cron: "15 7 * * *" # 15 minutos después de la nómina de Cámara
  workflow_dispatch:
    inputs:
      from:
        description: Fecha inicial YYYY-MM-DD (por defecto 7 días atrás)
        required: false
      to:
        description: Fecha final YYYY-MM-DD
        required: false
      full_votaciones:
        description: Reconstruir todos los detalles oficiales (sólo backfill)
        required: false
        type: boolean
        default: false
      repair_attendance:
        description: Reparar sólo asistencia Cámara 2026-09 en R2, sin ETL general
        required: false
        type: boolean
        default: false
      confirm_attendance:
        description: Escribe CAMBIOMETRO_CONFIRM_CAMARA_ATTENDANCE_REPAIR para reparar
        required: false
        type: string
        default: ""
      repair_authorities:
        description: Reparar sólo autoridades Cámara 2026-09 en R2, sin ETL general
        required: false
        type: boolean
        default: false
      confirm_authorities:
        description: Escribe CAMBIOMETRO_CONFIRM_CAMARA_AUTHORITIES_REPAIR para reparar
        required: false
        type: string
        default: ""
      repair_votes:
        description: Reparar sólo votaciones Cámara 2026-09 en R2, sin ETL general
        required: false
        type: boolean
        default: false
      confirm_votes:
        description: Escribe CAMBIOMETRO_CONFIRM_CAMARA_VOTES_REPAIR para reparar
        required: false
        type: string
        default: ""

concurrency:
  group: cambiometro-static-publication
  cancel-in-progress: false

permissions:
  # El publicador consulta y actualiza el release de datos para dejar
  # trazabilidad del corte; no materializa D1.
  contents: write

jobs:
  ingest-publish:
    name: Votaciones oficiales de Cámara
    if: inputs.repair_attendance != true && inputs.repair_authorities != true && inputs.repair_votes != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Instalar dependencias
        working-directory: transparencia-app
        run: npm ci

      - name: Exigir credenciales de datos
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DATA_API_TOKEN"

      - name: Recuperar catálogo vigente
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          mkdir -p data/lake/catalog/v1
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Resolver rango con solapamiento
        id: range
        shell: bash
        env:
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          echo "from=${INPUT_FROM:-$(date -u -d '7 days ago' +%F)}" >> "$GITHUB_OUTPUT"
          echo "to=${INPUT_TO:-$(date -u +%F)}" >> "$GITHUB_OUTPUT"

      - name: Preparar workspace ETL sin datasets versionados
        working-directory: transparencia-app
        run: npm run etl:prepare

      - name: Hidratar snapshot combinado vigente antes de actualizar Cámara
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:hydrate:static -- --required --required-files data/politicos-votaciones.json --only-files data/politicos-votaciones.json --force

      - name: Ingerir sólo votaciones de Cámara
        working-directory: transparencia-app
        run: npm run etl -- --from "${{ steps.range.outputs.from }}" --to "${{ steps.range.outputs.to }}" --source votaciones_camara

      - name: Construir y publicar lake de Cámara
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npm run data:lake -- --source votaciones_camara --hydrate-history
          npm run data:publish

      - name: Actualizar cache estático incremental de Cámara
        working-directory: transparencia-app
        env:
          FULL_VOTACIONES: ${{ inputs.full_votaciones }}
        shell: bash
        run: |
          if [[ "$FULL_VOTACIONES" == "true" ]]; then
            npm run ingest:votaciones-full -- --source camara --full
          else
            npm run ingest:votaciones-full -- --source camara
          fi

      - name: Construir subsets y publicar entradas estáticas
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npm run data:build:subsets
          npm run data:publish:static -- --groups parlamento

  repair-attendance:
    name: Reparación aislada de asistencia Cámara
    if: inputs.repair_attendance == true
    uses: ./.github/workflows/repair-camara-attendance-staged.yml
    with:
      confirm_repair: ${{ inputs.confirm_attendance }}
    secrets: inherit

  repair-authorities:
    name: Reparación aislada de autoridades Cámara
    if: inputs.repair_authorities == true
    uses: ./.github/workflows/repair-camara-attendance-staged.yml
    with:
      confirm_repair: ${{ inputs.confirm_authorities }}
      variant: congreso_opendata
      expected_count: 155
    secrets: inherit

  repair-votes:
    name: Reparación aislada de votaciones Cámara
    if: inputs.repair_votes == true
    uses: ./.github/workflows/repair-camara-attendance-staged.yml
    with:
      confirm_repair: ${{ inputs.confirm_votes }}
      variant: votaciones_camara
      expected_count: 49
    secrets: inherit
