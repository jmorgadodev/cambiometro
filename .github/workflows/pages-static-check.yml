name: Pages static + public API check

on:
  push:
    paths:
      - "transparencia-app/app/**"
      - "transparencia-app/components/**"
      - "transparencia-app/lib/**"
      - "transparencia-app/public/**"
      - "transparencia-app/scripts/build-pages-static.mjs"
      - "transparencia-app/scripts/build-funcionarios-static.mjs"
      - "transparencia-app/scripts/hydrate-cplt-from-r2.mjs"
      - "transparencia-app/scripts/verify-pages-static.mjs"
      - "transparencia-app/scripts/prune-pages-output.mjs"
      - "transparencia-app/scripts/verify-pages-crawl.mjs"
      - "transparencia-app/workers/public-api/**"
      - "transparencia-app/package.json"
  workflow_dispatch:

concurrency:
  group: pages-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Static Pages and Worker dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json
      - run: npm ci
        working-directory: transparencia-app
      - run: npm run audit:repo-boundary
        working-directory: transparencia-app
      - name: Hydrate official CPLT partitions from R2
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:hydrate:cplt
      - name: Descargar el universo oficial de transferencias para el build
        working-directory: transparencia-app
        run: |
          npm run data:backfill:ley19862 -- --year "$(date -u +%Y)" --through-month "$(date -u +%-m)"
          npm run data:verify:full:ley19862
      - run: npm run pages:build
        working-directory: transparencia-app
        env:
          REQUIRE_COMPLETE_CPLT: "1"
          CPLT_ALLOW_UNAVAILABLE: "1"
      - run: npm run pages:verify
        working-directory: transparencia-app
        env:
          REQUIRE_COMPLETE_CPLT: "1"
          CPLT_ALLOW_UNAVAILABLE: "1"
      - run: npm run data:verify:coherence
        working-directory: transparencia-app
      - run: npm run worker:check
        working-directory: transparencia-app
      - run: npm run worker:test
        working-directory: transparencia-app
      - run: npm run worker:bundle
        working-directory: transparencia-app
