name: ETL Semanal - ChileCompra OCDS

on:
  schedule:
    - cron: "0 8 * * 1" # Lunes 04:00 CLT
  workflow_dispatch:
    inputs:
      year:
        description: Año a procesar (ej. 2026)
        required: false
      month:
        description: Mes a procesar (1-12)
        required: false
      resume_saved_july_2026:
        description: Recuperar julio validado de GitHub, sin repetir extracción (requiere lector gzip-pages desplegado)
        type: boolean
        default: false
      compress_index:
        description: Índice por páginas gzip (activar sólo después de promover el lector compatible)
        type: boolean
        default: false
      preflight_only:
        description: Validar recuperación y presupuesto sin publicar datos ni artefactos GitHub
        type: boolean
        default: false

concurrency:
  group: cambiometro-static-publication
  cancel-in-progress: false
  queue: max

jobs:
  ingest-publish-materialize:
    name: Contrataciones Públicas OCDS
    runs-on: ubuntu-latest
    # July 2026 alone has 38k detail URLs at the conservative 5 req/s cap.
    # Keep the source rate unchanged and allow the complete monthly run to finish.
    timeout-minutes: 240
    permissions:
      contents: write
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales y recuperar catálogo vigente
        shell: bash
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          mkdir -p data/lake/catalog/v1
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Preparar workspace ETL sin datasets versionados
        working-directory: transparencia-app
        run: npm run etl:prepare

      - name: Seleccionar último período con datos oficiales no publicado
        id: source-period
        working-directory: transparencia-app
        env:
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_MONTH: ${{ inputs.month }}
          RESUME_SAVED_JULY: ${{ inputs.resume_saved_july_2026 }}
        run: |
          if [ "$RESUME_SAVED_JULY" = "true" ]; then
            test "$INPUT_YEAR" = "2026"
            test "$INPUT_MONTH" = "07"
            echo "has_records=true" >> "$GITHUB_OUTPUT"
            echo "year=2026" >> "$GITHUB_OUTPUT"
            echo "month=07" >> "$GITHUB_OUTPUT"
          else
            node scripts/select-chilecompra-period.mjs
          fi

      - name: Omitir publicación si el origen no tiene un nuevo corte
        if: steps.source-period.outputs.has_records != 'true'
        run: echo "::notice::ChileCompra no publica todavía un mes nuevo con registros; se conserva íntegro el último release válido."

      - name: Ingerir y proyectar ChileCompra OCDS
        if: steps.source-period.outputs.has_records == 'true' && inputs.resume_saved_july_2026 != true
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_YEAR: ${{ steps.source-period.outputs.year }}
          INPUT_MONTH: ${{ steps.source-period.outputs.month }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npm run ingest:chilecompra -- --year "$INPUT_YEAR" --month "$INPUT_MONTH" --concurrency 24 --rate 5
          npm run data:lake:projection:chilecompra
          npm run data:build:subsets
          # Validate all ChileCompra static artifacts before any lake/catalog write to R2.
          npm run check:static-input-quality

      - name: Recuperar índice base vigente para reconstrucción y validación histórica
        if: steps.source-period.outputs.has_records == 'true'
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          index_work="data/lake/.work/chilecompra-r2-index"
          mkdir -p "$index_work"
          npx wrangler r2 object get transparencia-public-data/indexes/v1/chilecompra/manifest.json --file "$index_work/base-manifest.json" --remote
          archive_key="$(node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(m.sourceId!=="chilecompra"||typeof m.recordArchiveKey!=="string"||!m.recordArchiveKey.startsWith("indexes/v1/chilecompra/"))process.exit(2);process.stdout.write(m.recordArchiveKey);' "$index_work/base-manifest.json")"
          npx wrangler r2 object get "transparencia-public-data/$archive_key" --file "$index_work/base-records.jsonl" --remote

      - name: Recuperar candidato julio verificado sin consultar nuevamente el origen
        if: inputs.resume_saved_july_2026 == true
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          candidate_dir="data/lake/.work/saved-july-2026"
          mkdir -p "$candidate_dir"
          gh release download data-chilecompra-2026-d39dd8ee32c5c073 --dir "$candidate_dir" \
            --pattern chilecompra-2026-07-records.jsonl.gz \
            --pattern chilecompra-2026-07-manifest.json \
            --pattern chilecompra-2026-07-original-chilecompra-2026-07-rejected-documents.json
          entity_key="$(node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("data/lake/catalog/v1/manifest.json","utf8")); const s=c.sources.find(s=>s.id==="chilecompra"); if(!/^entities\/v1\/chilecompra-[a-f0-9]{64}\.jsonl\.gz$/.test(s?.entityKey??""))process.exit(2); process.stdout.write(s.entityKey);')"
          npx wrangler r2 object get "transparencia-public-data/$entity_key" --file "$candidate_dir/previous-entities.jsonl.gz" --remote
          entity_index_key="$(node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("data/lake/catalog/v1/manifest.json","utf8")); const s=c.sources.find(s=>s.id==="chilecompra"); if(!/^indexes\/v1\/chilecompra\/entities-[a-f0-9]{64}\.jsonl\.gz$/.test(s?.entityIndexKey??""))process.exit(2); process.stdout.write(s.entityIndexKey);')"
          npx wrangler r2 object get "transparencia-public-data/$entity_index_key" --file "$candidate_dir/previous-entity-index.jsonl.gz" --remote
          monthly_archive_key="$(node --input-type=module -e 'import fs from "node:fs";const c=JSON.parse(fs.readFileSync("data/lake/catalog/v1/manifest.json","utf8"));const p=c.partitions.find(p=>p.id==="chilecompra/2026/06");if(!/^[a-f0-9]{64}$/.test(p?.checksumSha256??""))process.exit(2);process.stdout.write(`partitions/chilecompra/2026/06/records-${p.checksumSha256}.jsonl.gz`);')"
          monthly_args=()
          if npx wrangler r2 object get "transparencia-public-data/$monthly_archive_key" --file "$candidate_dir/previous-partition-records.jsonl.gz" --remote; then
            monthly_args=(--base-partition-archive "$candidate_dir/previous-partition-records.jsonl.gz")
          else
            echo "::notice::El archivo mensual no está disponible; se exige reconstrucción con SHA exacto desde el índice vigente."
          fi
          # Recuperar junio sólo si el índice reproduce exactamente el SHA del
          # archivo canónico declarado. No se fabrica el manifiesto original.
          node scripts/restore-chilecompra-candidate.mjs --candidate-dir "$candidate_dir" --base-entities "$candidate_dir/previous-entities.jsonl.gz" --base-entity-index "$candidate_dir/previous-entity-index.jsonl.gz" --base-manifest data/lake/.work/chilecompra-r2-index/base-manifest.json --base-archive data/lake/.work/chilecompra-r2-index/base-records.jsonl --lake-root data/lake "${monthly_args[@]}"
          npm run data:lake:projection:chilecompra
          npm run data:build:subsets
          npm run check:static-input-quality

      - name: Reconstruir índice completo ChileCompra desde el release vigente
        if: steps.source-period.outputs.has_records == 'true'
        working-directory: transparencia-app
        env:
          INPUT_YEAR: ${{ steps.source-period.outputs.year }}
          INPUT_MONTH: ${{ steps.source-period.outputs.month }}
          COMPRESS_INDEX: ${{ inputs.compress_index || inputs.resume_saved_july_2026 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        shell: bash
        run: |
          index_work="data/lake/.work/chilecompra-r2-index"
          base_manifest="$index_work/base-manifest.json"
          base_archive="$index_work/base-records.jsonl"
          encoding_args=()
          if [ "$COMPRESS_INDEX" = "true" ]; then encoding_args=(--archive-encoding gzip-pages); fi
          node scripts/refresh-chilecompra-r2-index.mjs --period "${INPUT_YEAR}-${INPUT_MONTH}" --base-manifest "$base_manifest" --base-archive "$base_archive" --lake-root data/lake "${encoding_args[@]}"

      - name: Medir candidato sin escrituras con las mismas guardas de publicación
        if: steps.source-period.outputs.has_records == 'true'
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: node scripts/publish-data-lake.mjs --r2 --preflight-only

      - name: Publicar release de datos e índices validados en R2
        if: steps.source-period.outputs.has_records == 'true' && inputs.preflight_only != true
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish

      - name: Publicar entradas estáticas versionadas para Pages
        if: steps.source-period.outputs.has_records == 'true' && inputs.preflight_only != true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:static -- --groups chilecompra

      - name: Refrescar catálogo maestro antes de materializar
        if: steps.source-period.outputs.has_records == 'true' && inputs.preflight_only != true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Preflight de cuota D1 antes de materializar
        if: steps.source-period.outputs.has_records == 'true' && inputs.resume_saved_july_2026 != true && inputs.preflight_only != true
        id: d1-quota
        uses: ./.github/actions/d1-preflight
        with:
          threshold-percent: "60"
          output: transparencia-app/d1-preflight.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}

      - name: Materializar D1 y registrar ejecución
        if: github.event_name == 'workflow_dispatch' && steps.d1-quota.outputs.proceed == 'true' && steps.source-period.outputs.has_records == 'true'
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          ETL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run data:materialize:optional -- --database transparencia-db --remote --skip-unchanged --sources chilecompra

      - name: Registrar D1 pospuesto por cuota
        if: steps.source-period.outputs.has_records == 'true' && inputs.resume_saved_july_2026 != true && inputs.preflight_only != true && steps.d1-quota.outputs.proceed != 'true'
        run: echo "::warning::D1 de ChileCompra pospuesto por cuota alta o métrica ilegible; R2/Pages conserva el release canónico."

      - name: Conservar diagnóstico de preflight D1
        if: always() && steps.d1-quota.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: d1-preflight-chilecompra-${{ github.run_id }}
          path: transparencia-app/d1-preflight.json
          if-no-files-found: warn
          retention-days: 31
