name: ETL publication guard

on:
  workflow_run:
    workflows:
      - "ETL Mensual - Ley 19.862 Transferencias del Estado"
      - "ETL Diario - Cámara"
      - "ETL Diario - Votaciones Cámara"
      - "ETL Diario - Votaciones Senado"
      - "ETL Diario - Movimientos de Autoridades"
      - "ETL Mensual - Remuneraciones 38 bis"
      - "ETL Semanal - Personal de apoyo Cámara"
      - "ETL Semanal - Personal de apoyo Senado"
      - "ETL Mensual - CPLT Nóminas Transparencia Activa"
      - "ETL Semanal - ChileCompra OCDS"
      - "ETL Mensual - Contraloría General (CGR)"
      - "ETL Semanal - InfoLobby"
      - "ETL Mensual - InfoProbidad DIP"
      - "ETL Trimestral - DIPRES Presupuestos"
      - "ETL Bajo Demanda - SERVEL Resultados Electorales"
      - "ETL Semestral - SINIM Finanzas Municipales"
      - "ETL Mensual - Gastos Operacionales Senado"
    types: [completed]
  workflow_dispatch:

concurrency:
  group: etl-publication-guard
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'push')
    runs-on: ubuntu-latest
    # Pages hidrata desde R2, construye y publica después del ETL. En los
    # releases grandes el despliegue puede superar los 10 minutos; la guardia
    # debe esperar el resultado real antes de declarar un falso negativo.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Comprobar si Movimientos publicó cambios
        id: decision
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_run' && context.payload.workflow_run.name === 'ETL Semanal - Personal de apoyo Senado') {
              const { shouldRefreshPersonalApoyo } = await import(`${process.env.GITHUB_WORKSPACE}/transparencia-app/scripts/etl/personal-apoyo-publication.mjs`);
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: context.payload.workflow_run.id });
              return shouldRefreshPersonalApoyo(jobs);
            }
            if (context.eventName === 'workflow_run' && ['ETL Semestral - SINIM Finanzas Municipales', 'ETL Trimestral - DIPRES Presupuestos', 'ETL Mensual - InfoProbidad DIP', 'ETL Mensual - Ley 19.862 Transferencias del Estado'].includes(context.payload.workflow_run.name)) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: context.payload.workflow_run.id });
              const steps = jobs.flatMap(job => job.steps ?? []).filter(step => step.name === 'Publicar entradas estáticas versionadas para Pages');
              if (steps.length !== 1 || !['success', 'skipped'].includes(steps[0].conclusion)) throw new Error('STATIC_PUBLICATION_RESULT_INVALID');
              return steps[0].conclusion === 'success';
            }
            if (context.eventName === 'workflow_run' && context.payload.workflow_run.name === 'ETL Mensual - Remuneraciones 38 bis') {
              const { shouldVerify38BisPublication } = await import(`${process.env.GITHUB_WORKSPACE}/transparencia-app/scripts/etl/remuneraciones-38bis-publication.mjs`);
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: context.payload.workflow_run.id });
              return shouldVerify38BisPublication(jobs);
            }
            if (context.eventName === 'workflow_run' && context.payload.workflow_run.name === 'ETL Mensual - CPLT Nóminas Transparencia Activa') {
              const { shouldVerifyCpltPublication } = await import(`${process.env.GITHUB_WORKSPACE}/transparencia-app/scripts/etl/cplt-source-freshness.mjs`);
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: context.payload.workflow_run.id });
              return shouldVerifyCpltPublication(jobs);
            }
            if (context.eventName !== 'workflow_run' || context.payload.workflow_run.name !== 'ETL Diario - Movimientos de Autoridades') return true;
            const { shouldRefreshMovements } = await import(`${process.env.GITHUB_WORKSPACE}/transparencia-app/scripts/movimientos-publication.mjs`);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: context.payload.workflow_run.id });
            return shouldRefreshMovements(jobs);
      - name: Verificar publicación R2/D1 y manifest Pages
        if: steps.decision.outputs.result == 'true'
        working-directory: transparencia-app
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://cambiometro.impulsacv.cl' }}
          API_URL: ${{ vars.API_URL || 'https://cambiometro.impulsacv.cl' }}
          UPTIME_TOKEN: ${{ secrets.CAMBIOMETRO_UPTIME_TOKEN }}
          ETL_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          ETL_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
          STATIC_RELEASE_WAIT_MS: "1800000"
          STATIC_RELEASE_POLL_MS: "20000"
        run: node scripts/verify-etl-freshness.mjs
