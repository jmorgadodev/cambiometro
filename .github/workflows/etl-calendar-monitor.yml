name: ETL calendar metadata monitor

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Read workflow execution metadata only
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          ETL_MONITOR_GRACE_MINUTES: "180"
        run: node scripts/etl/calendar-monitor.mjs --output etl-calendar-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: etl-calendar-metadata
          path: transparencia-app/etl-calendar-report.json
          retention-days: 3
          if-no-files-found: error
