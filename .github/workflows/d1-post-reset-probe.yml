name: D1 post-reset probe

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: d1-post-reset-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: Confirmar cuota y consulta paginada de Cámara
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Consultar uso D1 sin ejecutar SQL
        id: usage
        continue-on-error: true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WRANGLER_TOKEN }}
          D1_USAGE_OUTPUT: d1-post-reset-usage.json
        run: node scripts/check-d1-usage.mjs

      - name: Detener sin tocar producción mientras D1 siga crítica
        id: gate
        if: always()
        working-directory: transparencia-app
        env:
          USAGE_OUTCOME: ${{ steps.usage.outcome }}
        run: |
          test -f d1-post-reset-usage.json || {
            echo "No se generó el reporte de Analytics D1." >&2
            exit 1
          }
          level=$(node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync("d1-post-reset-usage.json","utf8")); process.stdout.write(String(r.level||"unknown"))')
          echo "D1 level=$level; analytics_step=$USAGE_OUTCOME"
          if [ "$level" = "critical" ]; then
            echo "D1 sigue crítica; no se ejecuta ninguna petición a la API ni SQL."
            echo "probe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$USAGE_OUTCOME" = "success"
          echo "probe=true" >> "$GITHUB_OUTPUT"

      - name: Consultar una sola página de Cámara
        if: steps.gate.outputs.probe == 'true'
        working-directory: transparencia-app
        env:
          UPTIME_TOKEN: ${{ secrets.CAMBIOMETRO_UPTIME_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$UPTIME_TOKEN"
          curl --fail --silent --show-error --max-time 20 \
            --header "Cache-Control: no-cache" \
            --header "X-Cambiometro-Uptime-Token: $UPTIME_TOKEN" \
            "https://cambiometro.impulsacv.cl/api/v1/records?source=camara&limit=1&d1_post_reset=$RUN_ID" \
            > d1-post-reset-camara.json
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync("d1-post-reset-camara.json", "utf8"));
            const meta = payload.meta || {};
            if (meta.sourceStatus === "temporarily-unavailable" || meta.sourceBackend === "none") {
              throw new Error(`Cámara sigue degradada: ${JSON.stringify(meta)}`);
            }
            if (!Array.isArray(payload.data) || payload.data.length > 1) {
              throw new Error("La respuesta no está acotada a una página de máximo una fila");
            }
            console.log(JSON.stringify({ ok: true, rows: payload.data.length, meta }, null, 2));
          '

      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-post-reset-${{ github.run_id }}
          path: |
            transparencia-app/d1-post-reset-usage.json
            transparencia-app/d1-post-reset-camara.json
          if-no-files-found: warn
          retention-days: 31
