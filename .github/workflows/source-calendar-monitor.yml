name: Source calendar metadata monitor

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Read calendar and release metadata; group consistency incidents
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          ETL_MONITOR_GRACE_MINUTES: "180"
          PROD_URL: https://cambiometro.impulsacv.cl
          API_URL: https://cambiometro.impulsacv.cl
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: node scripts/etl/calendar-monitor.mjs --release-check --source-check --budget-check --sync-incidents --output etl-calendar-report.json
      - name: Detect normative documents for review (weekly, no automatic publication)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15 * * *')
        continue-on-error: true
        working-directory: transparencia-app
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            node scripts/normative-monitor.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normative-review-candidates
          path: transparencia-app/artifacts/normativa-monitor/
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etl-calendar-metadata
          path: transparencia-app/etl-calendar-report.json
          retention-days: 3
          if-no-files-found: error
