name: ETL Diario - Parlamento y Diario Oficial

on:
  schedule:
    - cron: "0 7 * * *" # 03:00 CLT diario
  workflow_dispatch:
    inputs:
      from:
        description: Fecha inicial YYYY-MM-DD (por defecto 3 días atrás)
        required: false
      to:
        description: Fecha final YYYY-MM-DD
        required: false
      full_votaciones:
        description: Reconstruir todos los detalles oficiales de votaciones (sólo para backfill)
        required: false
        type: boolean
        default: false
      skip_d1:
        description: Publicar el snapshot estático aunque D1 esté temporalmente sin cuota (sólo recuperación)
        required: false
        type: boolean
        default: false

concurrency:
  group: etl-daily
  cancel-in-progress: true

jobs:
  ingest-publish-materialize:
    name: Actividad Parlamentaria y Decretos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales de datos
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DATA_API_TOKEN"

      - name: Recuperar catalogo vigente
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          mkdir -p data/lake/catalog/v1
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Resolver rango con solapamiento
        id: range
        shell: bash
        env:
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          echo "from=${INPUT_FROM:-$(date -u -d '3 days ago' +%F)}" >> "$GITHUB_OUTPUT"
          echo "to=${INPUT_TO:-$(date -u +%F)}" >> "$GITHUB_OUTPUT"

      - name: Preparar workspace ETL sin datasets versionados
        working-directory: transparencia-app
        run: npm run etl:prepare

      - name: Ingerir nómina y votaciones de ambas cámaras
        working-directory: transparencia-app
        run: npm run etl -- --from "${{ steps.range.outputs.from }}" --to "${{ steps.range.outputs.to }}" --source camara,votaciones_camara,votaciones_senado

      - name: Construir y publicar lote parlamentario
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npm run data:lake -- --exclude-source infolobby,infoprobidad
          npm run data:publish

      - name: Ingerir asistencia oficial de Cámara
        working-directory: transparencia-app
        run: npm run ingest:camara-attendance -- --year "$(date -u +%Y)" --concurrency 8

      - name: Publicar asistencia
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish

      - name: Preflight de cuota D1 antes de materializar
        id: d1-quota
        if: inputs.skip_d1 != true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WRANGLER_TOKEN }}
          D1_USAGE_OUTPUT: d1-preflight.json
          D1_THRESHOLD_PERCENT: 60
        shell: bash
        run: |
          set +e
          node scripts/check-d1-usage.mjs
          usage_status=$?
          proceed=false
          if [[ -s "$D1_USAGE_OUTPUT" ]]; then
            read_percent=$(node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(report.readPercent ?? 100));' "$D1_USAGE_OUTPUT")
            if node -e 'process.exit(Number(process.argv[1]) < Number(process.argv[2]) ? 0 : 1)' "$read_percent" "$D1_THRESHOLD_PERCENT"; then
              proceed=true
            fi
            echo "D1 preflight: ${read_percent}% rows_read; threshold ${D1_THRESHOLD_PERCENT}%"
          else
            echo "::warning::No se pudo leer el uso D1; se omite materialización por seguridad."
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          if [[ "$proceed" != "true" ]]; then
            echo "::warning::D1 omitida: cuota igual o superior al umbral, o métrica ilegible. R2/estáticos continúan."
          fi
          exit 0

      - name: Materializar D1 y registrar ejecución
        if: inputs.skip_d1 != true && steps.d1-quota.outputs.proceed == 'true'
        working-directory: transparencia-app
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          ETL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run data:materialize -- --database transparencia-db --remote --skip-unchanged --sources camara,votaciones_senado

      - name: Registrar D1 pospuesto por recuperación R2
        if: inputs.skip_d1 == true || steps.d1-quota.outputs.proceed != 'true'
        run: echo "::warning::D1 pospuesto por cuota o solicitud manual; se publica el snapshot R2 y el materializado D1 queda para la siguiente ventana segura."

      - name: Conservar diagnóstico de preflight D1
        if: always() && inputs.skip_d1 != true
        uses: actions/upload-artifact@v4
        with:
          name: d1-preflight-${{ github.run_id }}
          path: transparencia-app/d1-preflight.json
          if-no-files-found: warn
          retention-days: 31

      - name: Actualizar cache estático de votaciones incremental
        working-directory: transparencia-app
        env:
          FULL_VOTACIONES: ${{ inputs.full_votaciones }}
        shell: bash
        run: |
          if [[ "$FULL_VOTACIONES" == "true" ]]; then
            npm run ingest:votaciones-full -- --full
          else
            npm run ingest:votaciones-full
          fi

      - name: Construir subsets y publicar entradas estáticas
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          npm run data:build:subsets
          npm run data:publish:static -- --groups parlamento

      # Las salidas generadas quedan en R2 mediante el manifiesto estático;
      # no se hacen commits automáticos de datasets al repositorio.

