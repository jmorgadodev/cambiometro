name: ETL Semanal - Personal de apoyo Senado

on:
  schedule:
    - cron: "30 7 * * 1" # lunes 03:30 America/Santiago en horario de verano
  workflow_dispatch:
    inputs:
      verify_release_only:
        description: Validar el release vigente sin extraer ni publicar datos
        type: boolean
        default: false

concurrency:
  group: cambiometro-static-publication
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  ingest-publish:
    name: Personal de apoyo del Senado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Instalar dependencias
        working-directory: transparencia-app
        run: npm ci

      - name: Exigir credenciales de datos
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DATA_API_TOKEN"

      - name: Recuperar último snapshot válido desde R2
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object get transparencia-public-data/projections/personal-apoyo-v1/manifest.json --file /tmp/personal-apoyo-manifest.json --remote
          npx wrangler r2 object get transparencia-public-data/projections/personal-apoyo-v1/personal-apoyo.json --file /tmp/personal-apoyo-downloaded.json --remote
          node scripts/verify-personal-apoyo-release.mjs --manifest /tmp/personal-apoyo-manifest.json --input /tmp/personal-apoyo-downloaded.json --output /tmp/personal-apoyo-current.json --subset /tmp/personal-apoyo-verified-subset.json

      - name: Ejecutar ETL desde la última proyección válida
        if: inputs.verify_release_only != true
        working-directory: transparencia-app
        run: npm run etl:personal-apoyo -- --source senado --input /tmp/personal-apoyo-current.json --output /tmp/personal-apoyo-next.json

      - name: Publicar personal de apoyo sólo en R2
        if: inputs.verify_release_only != true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:personal-apoyo -- --input /tmp/personal-apoyo-next.json --bucket transparencia-public-data --remote --skip-d1

      - name: Publicar entrada estática validada para Pages
        if: inputs.verify_release_only != true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          cp /tmp/personal-apoyo-next.json data/personal-apoyo.json
          npm run data:publish:static -- --files data/personal-apoyo.json

      - name: Publicar resumen y diagnóstico
        if: always() && inputs.verify_release_only != true
        uses: actions/upload-artifact@v4
        with:
          name: personal-apoyo-senado-run-${{ github.run_id }}
          path: |
            transparencia-app/data/personal-apoyo.json
            transparencia-app/data/generated
          if-no-files-found: warn
          retention-days: 30
