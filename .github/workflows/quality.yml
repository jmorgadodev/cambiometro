name: Quality (Lint, Types & Unit Tests)

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'auditoria_integridad_datos/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'auditoria_integridad_datos/**'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Types and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Verify repository boundary
        run: npm run audit:repo-boundary
        working-directory: transparencia-app

      - name: Lint
        run: npm run lint
        working-directory: transparencia-app

      - name: Types, Color Tokens and Unit Tests
        run: npm test
        working-directory: transparencia-app

      - name: Enforce data integrity guards V1-V7
        run: npm run guard:integrity
        working-directory: transparencia-app

      - name: Verify pinned data coherence
        run: npm run data:verify:coherence
        working-directory: transparencia-app

      - name: Check no AI traces
        run: node scripts/check-no-ai-traces.mjs
        working-directory: transparencia-app

      - name: Check no private assets
        run: node scripts/check-no-private-assets.mjs
        working-directory: transparencia-app

      - name: Guard runtime data imports under 200 KB
        run: node scripts/audit/scan-bundle-imports.mjs
        working-directory: transparencia-app

      - name: Test public API Worker contracts
        run: npm run worker:test && npm run worker:check && npm run worker:bundle
        working-directory: transparencia-app

      - name: Check staging D1 isolated (C1)
        run: node scripts/check-staging-isolated.mjs
        working-directory: transparencia-app

      - name: Check safe links and no HTML injection
        run: node scripts/check-safe-links.mjs && node scripts/check-no-innerhtml.mjs
        working-directory: transparencia-app
