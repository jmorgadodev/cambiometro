name: ETL Mensual - CPLT Nóminas Transparencia Activa

on:
  schedule:
    - cron: "0 9 5 * *" # Día 5 de cada mes, 05:00 CLT
  workflow_dispatch:
    inputs:
      check_sources_only:
        description: Comprobar frescura de los cuatro CSV sin ingesta ni publicación
        type: boolean
        default: false
      category:
        description: Categoría opcional (Planta, Contrata, Honorarios, CodigoTrabajo); vacío ejecuta todas
        required: false
      resume_run_id:
        description: Reutilizar las cuatro categorías validadas de un run fallido de main, sin extraer otra vez
        type: string
        required: false
        default: ""

concurrency:
  group: cambiometro-static-publication
  cancel-in-progress: false
  queue: max

jobs:
  cplt-source-check:
    name: Verificar frescura de fuentes CPLT
    if: ${{ !inputs.resume_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.freshness.outputs.changed }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Comparar ETag/Last-Modified con el manifest publicado
        id: freshness
        working-directory: transparencia-app
        run: npm run check:cplt-freshness
      - name: Registrar corrida omitida por fuente sin cambios
        if: steps.freshness.outputs.changed == 'false'
        run: echo "No hubo cambios en los cuatro CSV oficiales; se omite la descarga completa." >> "$GITHUB_STEP_SUMMARY"

  cplt-categories:
    name: Ingesta Nóminas CPLT (${{ matrix.category }})
    needs: cplt-source-check
    if: ${{ !inputs.resume_run_id && inputs.check_sources_only != true && needs.cplt-source-check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        category: [Planta, Contrata, Honorarios, CodigoTrabajo]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Verificar catálogo oficial de 346 comunas
        working-directory: transparencia-app
        run: npm run data:communes:check

      - name: Procesar categoría oficial CPLT
        working-directory: transparencia-app
        run: npm run ingest:cplt-personal -- "${{ matrix.category }}"

      - name: Preparar artefacto validado de categoría
        working-directory: transparencia-app
        run: npm run data:publish:cplt-category -- "${{ matrix.category }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cplt-${{ matrix.category }}
          path: transparencia-app/data/cplt-category/${{ matrix.category }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

  cplt-finalize:
    name: Consolidación y Publicación R2
    needs: [cplt-source-check, cplt-categories]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && inputs.check_sources_only != true && (inputs.resume_run_id || (needs.cplt-source-check.outputs.changed == 'true' && needs.cplt-categories.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      ETL_RUN_ID: cplt-${{ github.run_id }}-${{ github.run_attempt }}
      ETL_CADENCE: monthly
      # El lote municipal consolidado requiere más heap que el límite de Node.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales de publicación
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Validar procedencia del lote a recuperar
        if: inputs.resume_run_id
        uses: actions/github-script@v7
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        with:
          script: |
            const raw = process.env.RESUME_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(raw) || !Number.isSafeInteger(Number(raw))) throw new Error('CPLT_RESUME_RUN_ID_INVALID');
            const run_id = Number(raw);
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id });
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id });
            const { validateCpltResume, validateCpltResumeBaseline } = await import(`${process.env.GITHUB_WORKSPACE}/transparencia-app/scripts/etl/cplt-source-freshness.mjs`);
            validateCpltResume(run, jobs, artifacts, `${context.repo.owner}/${context.repo.repo}`);
            const { spawnSync } = await import('node:child_process');
            const manifest = spawnSync('node', [
              `${process.env.GITHUB_WORKSPACE}/transparencia-app/node_modules/wrangler/bin/wrangler.js`,
              'r2', 'object', 'get', 'transparencia-public-data/projections/funcionarios-v1/manifest.json', '--remote', '--pipe',
            ], { encoding: 'utf8', timeout: 60000, maxBuffer: 4 * 1024 * 1024 });
            if (manifest.status !== 0) throw new Error('CPLT_RESUME_BASELINE_UNAVAILABLE');
            validateCpltResumeBaseline(run, JSON.parse(manifest.stdout));
            core.info(`Recuperación validada: ${run_id}; cuatro categorías, sin nueva extracción.`);

      - uses: actions/download-artifact@v4
        with:
          pattern: cplt-*
          path: transparencia-app/data/cplt-artifacts
          run-id: ${{ inputs.resume_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Consolidar, validar y publicar lote completo
        working-directory: transparencia-app
        run: npm run data:finalize:cplt:r2

      - name: Archivar catálogo de checksums en GitHub Releases
        id: archive_release
        continue-on-error: true
        timeout-minutes: 5
        working-directory: transparencia-app
        run: npm run data:archive:cplt

      - name: Informar estado del archivo secundario
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.archive_release.outcome }}" = "failure" ]; then
            echo "::warning::Archivo GitHub Releases no crítico falló; R2 ya fue validado y activado como fuente productiva."
            {
              echo "### Archivo GitHub Releases no crítico"
              echo "- Estado: advertencia"
              echo "- La publicación canónica R2 terminó antes de este archivo secundario."
              echo "- El sitio y Pages pueden continuar usando el snapshot validado de R2."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Archivo GitHub Releases no crítico: completado" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Recuperar proyecciones estáticas vigentes para reconstruir agregados
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:hydrate:static -- --required --required-files data/lake/projections/v1/sinim.json,data/lake/projections/v1/chilecompra.json,data/lake/projections/v1/contraloria.json

      - name: Reconstruir ficha agregada de las 346 municipalidades
        working-directory: transparencia-app
        run: node --experimental-strip-types scripts/rebuild-authoritative-municipalidades.mjs

      - name: Publicar agregados municipales para Pages
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:static -- --groups municipalidades
