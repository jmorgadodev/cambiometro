name: ETL Mensual - CPLT Nóminas Transparencia Activa

on:
  schedule:
    - cron: "0 9 5 * *" # Día 5 de cada mes, 05:00 CLT
  workflow_dispatch:
    inputs:
      category:
        description: Categoría opcional (Planta, Contrata, Honorarios, CodigoTrabajo); vacío ejecuta todas
        required: false

concurrency:
  group: etl-cplt
  cancel-in-progress: true

jobs:
  cplt-source-check:
    name: Verificar frescura de fuentes CPLT
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.freshness.outputs.changed }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app
      - name: Comparar ETag/Last-Modified con el manifest publicado
        id: freshness
        working-directory: transparencia-app
        run: npm run check:cplt-freshness
      - name: Registrar corrida omitida por fuente sin cambios
        if: steps.freshness.outputs.changed == 'false'
        run: echo "No hubo cambios en los cuatro CSV oficiales; se omite la descarga completa." >> "$GITHUB_STEP_SUMMARY"

  cplt-categories:
    name: Ingesta Nóminas CPLT (${{ matrix.category }})
    needs: cplt-source-check
    if: needs.cplt-source-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        category: [Planta, Contrata, Honorarios, CodigoTrabajo]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Verificar catálogo oficial de 346 comunas
        working-directory: transparencia-app
        run: npm run data:communes:check

      - name: Procesar categoría oficial CPLT
        working-directory: transparencia-app
        run: npm run ingest:cplt-personal -- "${{ matrix.category }}"

      - name: Preparar artefacto validado de categoría
        working-directory: transparencia-app
        run: npm run data:publish:cplt-category -- "${{ matrix.category }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cplt-${{ matrix.category }}
          path: transparencia-app/data/cplt-category/${{ matrix.category }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

  cplt-finalize:
    name: Consolidación y Publicación R2 / D1
    needs: [cplt-source-check, cplt-categories]
    if: needs.cplt-source-check.outputs.changed == 'true' && needs.cplt-categories.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      ETL_RUN_ID: cplt-${{ github.run_id }}-${{ github.run_attempt }}
      ETL_CADENCE: monthly
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales de publicación
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - uses: actions/download-artifact@v4
        with:
          pattern: cplt-*
          path: transparencia-app/data/cplt-artifacts

      - name: Consolidar, validar y publicar lote completo
        working-directory: transparencia-app
        run: npm run data:finalize:cplt

      - name: Archivar catálogo de checksums en GitHub Releases
        id: archive_release
        continue-on-error: true
        timeout-minutes: 5
        working-directory: transparencia-app
        run: npm run data:archive:cplt

      - name: Informar estado del archivo secundario
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.archive_release.outcome }}" = "failure" ]; then
            echo "::warning::Archivo GitHub Releases no crítico falló; R2 ya fue validado y activado como fuente productiva."
            {
              echo "### Archivo GitHub Releases no crítico"
              echo "- Estado: advertencia"
              echo "- La publicación canónica R2 y el registro de estado CPLT terminaron antes de este respaldo."
              echo "- El sitio y Pages pueden continuar usando el snapshot validado de R2."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Archivo GitHub Releases no crítico: completado" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Recuperar proyecciones estáticas vigentes para reconstruir agregados
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:hydrate:static -- --required --required-files data/lake/projections/v1/sinim.json,data/lake/projections/v1/chilecompra.json,data/lake/projections/v1/contraloria.json

      - name: Reconstruir ficha agregada de las 346 municipalidades
        working-directory: transparencia-app
        run: node --experimental-strip-types scripts/rebuild-authoritative-municipalidades.mjs

      - name: Publicar agregados municipales para Pages
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:static -- --groups municipalidades
