name: Production verification (read-only)

on:
  workflow_dispatch:
    inputs:
      cold_crawl_concurrency:
        description: "Concurrencia del crawl; 1 evita saturar servidores locales/proxy"
        required: false
        default: "8"
      second_pass_delay_ms:
        description: "Espera entre pasadas; producción debe usar 600000"
        required: false
        default: "600000"

concurrency:
  group: production-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app
      - name: Install Chromium for token/CSP browser checks
        run: npx playwright install --with-deps chromium
        working-directory: transparencia-app
      - name: Verify production twice and cold crawl
        working-directory: transparencia-app
        env:
          PROD_URL: ${{ vars.CAMBIOMETRO_PROD_URL || 'https://cambiometro.impulsacv.cl' }}
          API_URL: ${{ vars.CAMBIOMETRO_API_URL || 'https://cambiometro.impulsacv.cl' }}
          VERIFY_BASE_URL: ${{ vars.CAMBIOMETRO_PROD_URL || 'https://cambiometro.impulsacv.cl' }}
          VERIFY_API_URL: ${{ vars.CAMBIOMETRO_API_URL || 'https://cambiometro.impulsacv.cl' }}
          UPTIME_TOKEN: ${{ secrets.CAMBIOMETRO_UPTIME_TOKEN }}
          VERIFY_THEME_BROWSER: "1"
          # La verificación usa el manifest publicado como release efectivo.
          # Los guards de build mantienen 59.361 y $5.011.094.170.302 como
          # mínimos históricos; producción puede servir un release posterior
          # completo sin que el verificador lo marque como inconsistente.
          VERIFY_SECOND_DELAY_MS: ${{ inputs.second_pass_delay_ms }}
          COLD_CRAWL_CONCURRENCY: ${{ inputs.cold_crawl_concurrency }}
          COLD_CRAWL_OUTPUT: artifacts/cold-crawl-production.json
        run: |
          mkdir -p artifacts
          set +e
          npm run verify:browser 2>&1 | tee artifacts/browser-production.log
          browser_status=${PIPESTATUS[0]}
          npm run verify:prod:double 2>&1 | tee artifacts/verify-prod-double.log
          double_status=${PIPESTATUS[0]}
          npm run verify:cold-crawl 2>&1 | tee artifacts/cold-crawl-output.log
          crawl_status=${PIPESTATUS[0]}
          if [ "$browser_status" -ne 0 ] || [ "$double_status" -ne 0 ] || [ "$crawl_status" -ne 0 ]; then
            echo "Production verification failed: browser=$browser_status double=$double_status crawl=$crawl_status" >&2
            exit 1
          fi
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ github.run_id }}
          path: transparencia-app/artifacts
          if-no-files-found: warn
          retention-days: 30
