name: ETL Trimestral - DIPRES Presupuestos

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *" # Trimestral (día 1 de Ene, Abr, Jul, Oct a las 05:00 CLT)
  workflow_dispatch:
    inputs:
      year:
        description: Año presupuestario (ej. 2026)
        required: false
      verify_release_only:
        description: "Verificar checksum del release R2 sin extracción ni publicación"
        type: boolean
        default: false

concurrency:
  group: cambiometro-static-publication
  cancel-in-progress: false
  queue: max

jobs:
  ingest-publish:
    name: Presupuesto Nacional y Ejecución DIPRES
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: transparencia-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: transparencia-app

      - name: Exigir credenciales y recuperar catálogo vigente
        shell: bash
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          mkdir -p data/lake/catalog/v1
          npx wrangler r2 object get transparencia-public-data/catalog/v1/manifest.json --file data/lake/catalog/v1/manifest.json --remote

      - name: Preparar workspace ETL sin datasets versionados
        if: inputs.verify_release_only != true
        working-directory: transparencia-app
        run: npm run etl:prepare -- --download-projections --sources dipres

      - name: Ingerir y proyectar Presupuestos DIPRES
        if: inputs.verify_release_only != true
        working-directory: transparencia-app
        env:
          INPUT_YEAR: ${{ inputs.year }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: |
          target_year="${INPUT_YEAR:-$(date -u +%Y)}"
          npm run ingest:dipres -- --year "$target_year"
          npm run data:lake:projection:presupuesto
          npm run data:build:subsets
          npm run data:publish

      - name: Publicar entradas estáticas versionadas para Pages
        if: inputs.verify_release_only != true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:publish:static -- --groups dipres

      - name: Verificar release DIPRES publicado sin extracción ni escrituras
        if: inputs.verify_release_only == true
        working-directory: transparencia-app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
        run: npm run data:hydrate:static -- --required --required-files data/lake/projections/v1/presupuesto.json,data/lake-subsets/presupuesto.subset.json --only-files data/lake/projections/v1/presupuesto.json,data/lake-subsets/presupuesto.subset.json --force

      # D1 no participa en este ETL: ni telemetría ni materialización.
