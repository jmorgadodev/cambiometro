name: D1 quota preflight
description: Check Cloudflare D1 free-tier usage before any remote materialization
inputs:
  threshold-percent:
    description: Maximum peak usage percentage allowed before deferring D1
    required: false
    default: "60"
  output:
    description: JSON report path relative to the repository root
    required: false
    default: "d1-preflight.json"
  allow-remote-materialization:
    description: Explicit opt-in for a remote D1 materialization. Scheduled ETLs keep this disabled.
    required: false
    default: "false"
outputs:
  proceed:
    description: Whether the workflow may materialize D1
    value: ${{ steps.preflight.outputs.proceed }}
  peak-percent:
    description: Peak rows_read/rows_written usage percentage
    value: ${{ steps.preflight.outputs.peak_percent }}
  reason:
    description: Decision explanation
    value: ${{ steps.preflight.outputs.reason }}
runs:
  using: composite
  steps:
    - id: preflight
      shell: bash
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        D1_USAGE_OUTPUT: ${{ inputs.output }}
        D1_THRESHOLD_PERCENT: ${{ inputs.threshold-percent }}
        D1_ALLOW_REMOTE_MATERIALIZATION: ${{ inputs.allow-remote-materialization }}
      run: |
        set +e
        node transparencia-app/scripts/check-d1-usage.mjs "$(date -u +%F)"
        usage_status=$?

        proceed=false
        peak_percent=100
        reason="policy-disabled"
        if [[ "$D1_ALLOW_REMOTE_MATERIALIZATION" != "true" ]]; then
          echo "D1 remote materialization is disabled by policy; R2/static publication remains canonical."
        elif [[ -s "$D1_USAGE_OUTPUT" ]]; then
          peak_percent="$(node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(Math.max(Number(report.readPercent ?? 100), Number(report.writePercent ?? 100))))' "$D1_USAGE_OUTPUT" 2>/dev/null)"
          if [[ "$usage_status" -eq 0 && "$peak_percent" =~ ^[0-9]+([.][0-9]+)?$ ]] && node -e 'process.exit(Number(process.argv[1]) < Number(process.argv[2]) ? 0 : 1)' "$peak_percent" "$D1_THRESHOLD_PERCENT"; then
            proceed=true
            reason="below-threshold"
          elif [[ "$usage_status" -ne 0 ]]; then
            reason="usage-unavailable"
          else
            reason="threshold-reached"
          fi
        elif [[ "$usage_status" -ne 0 ]]; then
          node -e 'const fs=require("fs"); const output=process.env.D1_USAGE_OUTPUT; const date=process.argv[1]; fs.mkdirSync(require("path").dirname(output), { recursive: true }); fs.writeFileSync(output, JSON.stringify({ date, status: "unavailable", reason: "D1_ANALYTICS_UNAUTHORIZED_OR_UNAVAILABLE" }, null, 2) + "\n")' "$(date -u +%F)"
        fi

        # Always preserve a machine-readable decision. A policy-disabled or
        # otherwise fail-safe branch must still leave evidence for the ETL
        # audit artifact instead of producing only a warning in the summary.
        if [[ ! -s "$D1_USAGE_OUTPUT" ]]; then
          D1_PREFLIGHT_REASON="$reason" node -e 'const fs=require("fs"); const path=require("path"); const output=process.env.D1_USAGE_OUTPUT; const date=process.argv[1]; const reason=process.env.D1_PREFLIGHT_REASON || "unknown"; fs.mkdirSync(path.dirname(output), { recursive: true }); fs.writeFileSync(output, JSON.stringify({ date, status: reason === "policy-disabled" ? "deferred" : "unavailable", reason, peakPercent: Number(process.env.D1_PEAK_PERCENT ?? 100), thresholdPercent: Number(process.env.D1_THRESHOLD_PERCENT ?? 60) }, null, 2) + "\n")' "$(date -u +%F)"
        fi

        {
          echo "D1 preflight decision: proceed=$proceed peak=${peak_percent}% threshold=${D1_THRESHOLD_PERCENT}% reason=$reason"
          if [[ "$proceed" != "true" ]]; then
            echo "D1 materialization deferred; R2/static publication remains canonical."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
        echo "peak_percent=$peak_percent" >> "$GITHUB_OUTPUT"
        echo "reason=$reason" >> "$GITHUB_OUTPUT"
        # Analytics failures and quota warnings are fail-safe: skip D1, do not
        # fail source ingestion or publish a partial D1 update.
        exit 0
