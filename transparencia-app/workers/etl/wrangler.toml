# Configuración histórica del Worker ETL congelado. No se usa para desplegar la app.
name = "transparencia-etl-legacy"
main = "cron.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "transparencia-db"
database_id = "3731487c-ed6b-401e-a33d-7ecf15bfd229"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "transparencia-assets"

[triggers]
crons = ["1 4 * * *"]

[vars]
ENVIRONMENT = "legacy"
APP_URL = "https://transparencia.impulsacv.cl"
ETL_TIMEZONE = "America/Santiago"
